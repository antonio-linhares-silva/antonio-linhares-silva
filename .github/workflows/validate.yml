name: Validate portfolio examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Python examples (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      GIT_PYTHON_REFRESH: quiet
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python scripts/check_docs.py
      - run: uv run --frozen python scripts/check_notebooks.py
      - run: uv run --frozen pytest -q
      - name: Execute public raster notebooks on CPU
        run: uv run --frozen python scripts/execute_notebooks.py --select 02 03 04 09 --output-dir outputs/ci-notebooks

  container:
    name: Installed CLI in Docker (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build frozen CPU image
        run: docker build -t geoai-portfolio .
      - name: Run with public fixtures and no network
        run: |
          mkdir -p outputs/container
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/data/fixtures:/data:ro" -v "$PWD/outputs/container:/output" \
            geoai-portfolio ndvi --scene /data/before.tif --scl /data/before-scl.tif \
            --output /output/ndvi.tif --window-size 17
          test -s outputs/container/ndvi.tif
