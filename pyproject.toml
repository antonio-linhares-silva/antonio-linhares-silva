[project]
name = "geoai-portfolio-examples"
version = "2.0.0"
description = "Reproducible public-data GeoAI notebooks and independent engineering examples"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "rasterio==1.5.1",
    "mlflow==3.16.0",
    "sqlalchemy==2.0.52",
    "geopandas==1.1.4",
    "laspy[lazrs]==2.7.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "fsspec==2026.7.0",
    "build==1.3.0",
    "matplotlib==3.11.2",
    "pandas==3.0.5",
    "requests==2.34.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
cpu = ["torch==2.14.0", "torchvision==0.29.0", "deepforest==2.1.0"]
cuda = ["torch==2.14.0", "torchvision==0.29.0", "deepforest==2.1.0"]

[project.scripts]
geoai-portfolio = "geoai_portfolio.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoai_portfolio"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "markdown-it-py==4.2.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_notebooks.py" = ["E501"] # Embedded notebook prose and code are formatted separately.
