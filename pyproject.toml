[project]
name = "geoai-portfolio-examples"
version = "1.0.0"
description = "Independent, synthetic examples accompanying a GeoAI engineering portfolio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "rasterio==1.5.1",
    "mlflow==3.16.0",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "markdown-it-py==4.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
